<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="opspilot-grad" x1="10" y1="10" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0284C7"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="opspilot-glow" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0EA5E9" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  <!-- Background circle with soft border -->
  <rect x="4" y="4" width="92" height="92" rx="28" fill="#0B192C" />
  
  <!-- Outer Orbit Workflow Ring -->
  <circle cx="50" cy="50" r="32" stroke="url(#opspilot-grad)" stroke-width="3" stroke-linecap="round" stroke-dasharray="140 30" />
  
  <!-- Orbiting Nodes -->
  <circle cx="50" cy="18" r="4.5" fill="#38BDF8" />
  <circle cx="78" cy="62" r="4" fill="#06B6D4" />
  <circle cx="24" cy="64" r="4" fill="#0284C7" />
  
  <!-- Central AI Pulse Node -->
  <circle cx="50" cy="50" r="14" fill="url(#opspilot-grad)" />
  <path d="M44 50L48 54L56 46" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Connecting Synapse Lines -->
  <path d="M50 36L50 24" stroke="#38BDF8" stroke-width="2" stroke-dasharray="2 3"/>
  <path d="M60 56L72 60" stroke="#06B6D4" stroke-width="2" stroke-dasharray="2 3"/>
  <path d="M40 56L28 62" stroke="#0284C7" stroke-width="2" stroke-dasharray="2 3"/>
</svg>
